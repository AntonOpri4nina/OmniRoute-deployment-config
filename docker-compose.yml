services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    user: node
    working_dir: /app
    command: node dev/run-standalone.mjs
    restart: unless-stopped
    ports:
      - "127.0.0.1:20128:20128"
    environment:
      OMNIROUTE_MEMORY_MB: ${OMNIROUTE_MEMORY_MB:-768}
    volumes:
      - ${OMNIROUTE_DATA_DIR:-./omniroute-data}:/app/data